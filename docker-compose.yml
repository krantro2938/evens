# Deploys the document server next to the lookcam camera stack:
#
#   cp .env.example .env && nano .env
#   docker compose up -d --build
#
# It deliberately publishes no ports. It joins the lookcam stack's network
# instead, which is what lets it reach the assignment reader as `assignment`
# and lets that stack's Caddy route even.aansl.com here as `evens` — so the
# glasses talk to one HTTPS host and nothing extra is exposed on the VPS.
#
# That network must already exist, i.e. the lookcam stack is up. It is created
# by `docker compose up` in cam-capture/vps/docker (project name `lookcam`).

name: evens

services:
  evens:
    build:
      context: .
    restart: unless-stopped
    # The largest container on the box (~325MB steady, vs ~90MB for the next
    # one), and the only unbounded one left after the lookcam stack was capped.
    # It runs Bun, whose response writer is eager — the same property that let
    # the camera gateway buffer ~1GB and trip the kernel OOM-killer on
    # 2026-07-30, taking every other service on the machine with it. Inside a
    # limit only this dies, and `restart: unless-stopped` puts it straight back.
    # 1g is above any legitimate peak and below that pathological one.
    #
    # mem_swappiness is what makes the cap real. This kernel is cgroup v1
    # WITHOUT swap accounting (no memory.memsw.limit_in_bytes), so mem_limit
    # bounds RAM only — without this, a runaway would spill into the host's
    # swapfile unbounded and still reach a global OOM, just slowly. Near 0 the
    # cgroup won't swap, hits its ceiling, and is killed on its own.
    #
    # 1 rather than 0: Compose drops this field on omitempty, so a literal 0 is
    # Go's zero value and never reaches the daemon — the container then runs at
    # the host default of 60 while the file claims otherwise. See the lookcam
    # stack's compose header for the full note and how to verify it.
    mem_limit: 1g
    mem_swappiness: 1
    environment:
      PORT: 8787
      # Same compose network, so this is the container, not the public vhost —
      # no TLS, no Caddy hop, and the token never leaves the docker bridge.
      ASSIGNMENT_URL: ${ASSIGNMENT_URL:-http://assignment:8091}
      # Must equal ASSIGNMENT_TOKEN in the lookcam stack's .env.
      ASSIGNMENT_TOKEN: ${ASSIGNMENT_TOKEN:?set ASSIGNMENT_TOKEN in .env}
      ASSIGNMENT_DEBOUNCE_MS: ${ASSIGNMENT_DEBOUNCE_MS:-2000}

      # ── the solve loop (server/solver.ts) ─────────────────────────────────
      # Every solution ever submitted lives in the volume below, so a rebuild
      # or a restart can't lose one.
      DATA_DIR: /app/data
      # The Claude routine's shared secret: it claims work with this. Also goes
      # in the routine's own prompt. Empty leaves /solution/claim open, which on
      # a public vhost means anyone can read the assignment and post a
      # "solution" onto your glasses.
      SOLVER_TOKEN: ${SOLVER_TOKEN:?set SOLVER_TOKEN in .env}
      # The camera web app's secret for POST /messages — the one message route
      # that isn't open, because it writes to the glasses. Must equal
      # MESSAGE_TOKEN in the lookcam stack's .env. Unset leaves it open; not
      # fatal (the feature still works), so no :? guard.
      MESSAGE_TOKEN: ${MESSAGE_TOKEN:-}
      # The routine a tap fires, and its API-trigger token — both from
      # claude.ai/code/routines. Without them a tap still queues the work, so
      # these are optional, and their absence is reported on the glasses rather
      # than looking like a dead button.
      ROUTINE_ID: ${ROUTINE_ID:-}
      ROUTINE_TOKEN: ${ROUTINE_TOKEN:-}
      # The BACKUP solver: when no agent claims a run, the server solves it
      # itself with this key rather than leaving a tap saying QUEUED forever.
      # Unset disables it and the loop behaves exactly as it did before — the
      # routine and runner.sh stay the only solvers. Same key the lookcam
      # stack's reader uses; it is one Google project either way.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      BACKUP_SOLVER_MODEL: ${BACKUP_SOLVER_MODEL:-gemini-3.6-flash}
      # How long an unclaimed run waits first: longer when the routine was
      # actually fired (a cloud session needs a minute or two to boot and claim)
      # than when the trigger is unconfigured and nothing is coming.
      BACKUP_SOLVER_DELAY_MS: ${BACKUP_SOLVER_DELAY_MS:-150000}
      BACKUP_SOLVER_QUEUE_DELAY_MS: ${BACKUP_SOLVER_QUEUE_DELAY_MS:-20000}

      # ── the review loop (server/review.ts) ────────────────────────────────
      # The SECOND routine: it grades what the solver wrote and the problems
      # that fall short come back to the solve queue as revision runs. Absent,
      # nothing is graded and this server behaves exactly as it did before.
      #
      # NOTE THAT EVERY VAR HAS TO BE LISTED HERE. This file enumerates the
      # environment rather than using `env_file`, so a name that is only in
      # .env reaches the substitution above and never the container — which
      # looks exactly like a misconfigured routine: the server boots fine and
      # says "Reviewer: no REVIEW_ROUTINE_ID" over a .env that plainly has one.
      REVIEW_ROUTINE_ID: ${REVIEW_ROUTINE_ID:-}
      # Defaults to the solver's: one API trigger can serve two routines in the
      # same account.
      REVIEW_ROUTINE_TOKEN: ${REVIEW_ROUTINE_TOKEN:-${ROUTINE_TOKEN:-}}
      # Grades nothing while leaving the routine configured.
      REVIEW_ENABLED: ${REVIEW_ENABLED:-1}
      # The rubric. Here so it can be tuned in .env and restarted rather than
      # rebuilt — the defaults are the ones review.ts documents.
      REVIEW_ANSWER_BAND: ${REVIEW_ANSWER_BAND:-3}
      REVIEW_ANSWER_MAX: ${REVIEW_ANSWER_MAX:-15}
      REVIEW_METHOD_MAX: ${REVIEW_METHOD_MAX:-18}
      REVIEW_METHOD_ANSWER_POINTS: ${REVIEW_METHOD_ANSWER_POINTS:-5}
      REVIEW_METHOD_PASS: ${REVIEW_METHOD_PASS:-13}
      # Total attempts at a problem, first included. The only thing bounding
      # what the loop spends.
      REVIEW_MAX_ROUNDS: ${REVIEW_MAX_ROUNDS:-3}
      REVIEW_TIMEOUT_MS: ${REVIEW_TIMEOUT_MS:-1200000}

      # How much denser /assignment/sheet.png is than the panel, for the camera
      # site's Assignment tab. Page images are always 1:1 and unaffected.
      SHEET_SCALE: ${SHEET_SCALE:-2}
    volumes:
      - solver_data:/app/data
      # The encyclopedia, mounted rather than baked in. It is ~5MB of content
      # that changes on its own schedule, and the image above spends most of
      # its build installing Chromium — so a new pack is `git pull` plus a
      # restart, not a rebuild. Read-only: the server only ever reads it.
      # Absent, /enc/* answers 503 enc_not_packed and nothing else notices.
      - ./content/enc:/app/content/enc:ro
    networks: [lookcam]

volumes:
  # Named, not a bind mount: this holds the solution history and the OAuth
  # credentials, and `docker compose down` must not take them with it.
  solver_data:

networks:
  lookcam:
    external: true
    name: lookcam_default
